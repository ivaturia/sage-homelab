services:
  redpanda:
    image: redpandadata/redpanda:v26.1.9
    container_name: redpanda
    restart: always
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 2
      - --memory 1G          # 512M causes OOM on startup on the Mac Mini M4
      - --default-log-level=warn
    # Nothing here has authentication yet, so every port is Mac-only.
    # Containers reach Redpanda over sage-network (redpanda:9092, redpanda:9644).
    ports:
      - "127.0.0.1:19092:19092"   # Kafka API (host clients)
      - "127.0.0.1:18082:18082"   # HTTP Proxy
      - "127.0.0.1:18081:18081"   # Schema Registry
      - "127.0.0.1:19644:9644"    # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - sage-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: redpandadata/console@sha256:72bd99bdc304a7c6aab58bfaccf92e302d4e826f6f4737d14953eb04ceed7c07
    container_name: redpanda-console
    restart: always
    ports:
      - "127.0.0.1:8090:8080"     # no login: Mac-only
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - sage-network

volumes:
  redpanda_data:

networks:
  sage-network:
    external: true