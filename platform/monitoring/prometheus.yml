global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  # ── Monitoring stack ──────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']   # admin port, serves /metrics

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']   # collector's own telemetry

  # ── Event bus ─────────────────────────────────────────────────
  - job_name: 'redpanda'
    metrics_path: /public_metrics
    static_configs:
      - targets: ['redpanda:9644']  # admin API port inside sage-network

  # ── Data layer ────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['sage-postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['sage-redis-exporter:9121']

  # Pending: minio (metrics endpoint requires auth; follow-up)