global:
  resolve_timeout: 5m

route:
  receiver: 'human-slack'
  group_by: ['alertname', 'name', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # Phase 3: also send a copy to the Supervisor agent (keep the human route too,
  # so alerts still reach a person when SAGE itself is what's broken).
  # routes:
  #   - receiver: 'sage-supervisor'
  #     continue: true

receivers:
  # Direct to a human. Bypasses Redpanda and the agents entirely.
  - name: 'human-slack'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}*{{ .Labels.severity | toUpper }}*: {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  # Phase 3: the Supervisor agent, reached by service name on sage-network.
  # - name: 'sage-supervisor'
  #   webhook_configs:
  #     - url: 'http://supervisor:5001/alerts'
  #       send_resolved: true

inhibit_rules:
  # A container that is down should not also produce "restarting" warnings.
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['name']