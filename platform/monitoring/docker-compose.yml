services:
  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: prometheus
    mem_limit: 1g
    restart: always
    ports:
      - "127.0.0.1:9090:9090"   # local only: no login, lifecycle API enabled
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://localhost:9090'
    networks:
      - sage-network

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    mem_limit: 768m
    restart: always
    ports:
      - "3000:3000"             # LAN: protected by Grafana login
    environment:
      # Applied only when Grafana's database is first created;
      # to change later use: grafana cli admin reset-admin-password
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - sage-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    mem_limit: 512m
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - sage-network

  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    mem_limit: 512m
    restart: always
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sage-network

  promtail:
    image: grafana/promtail:3.6.8
    container_name: promtail
    mem_limit: 256m
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - sage-network

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    mem_limit: 512m
    restart: always
    ports:
      - "127.0.0.1:16686:16686"  # UI only; traces arrive via otel-collector over sage-network
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - MEMORY_MAX_TRACES=20000   # in-memory store is unbounded by default
    networks:
      - sage-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    container_name: otel-collector
    mem_limit: 768m
    restart: always
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC: the single front door for traces
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - ./otelcollector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - jaeger
    networks:
      - sage-network

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: alertmanager
    mem_limit: 128m
    restart: always
    ports:
      - "127.0.0.1:9093:9093"   # local only: no login, silences could be set by anyone
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - sage-network

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:

networks:
  sage-network:
    external: true