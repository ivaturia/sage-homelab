services:

  postgres:
    image: postgres:16.14-alpine
    container_name: sage-postgres
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # Read by the init script on first start only
      POSTGRES_SAGE_USER: ${POSTGRES_SAGE_USER}
      POSTGRES_SAGE_PASSWORD: ${POSTGRES_SAGE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - sage-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.9-alpine
    container_name: sage-redis
    mem_limit: 768m
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    environment:
      # redis-cli reads this automatically, so the healthcheck can authenticate
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - sage-network
    healthcheck:
      # grep for PONG: an auth failure still exits 0, so the exit code alone lies
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: sage-seaweedfs
    mem_limit: 1g
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # SeaweedFS does not expand env vars in its S3 config, so the config is generated
    # at start-up. "exec" makes weed PID 1, so it receives Docker's stop signal directly.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"sage","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.config=/tmp/s3.json -metricsPort=9327 -master.volumeSizeLimitMB=1024 -volume.max=0
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API: local only (ADR-003). Master/filer UIs stay internal.
    networks:
      - sage-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: sage-postgres-exporter
    mem_limit: 128m
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    # No host port: Prometheus scrapes it over sage-network
    networks:
      - sage-network
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0
    container_name: sage-redis-exporter
    mem_limit: 128m
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # No host port: Prometheus scrapes it over sage-network
    networks:
      - sage-network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:

networks:
  sage-network:
    external: true
